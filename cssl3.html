<html>
    <head>
        <title>My superhero card</title>
        <style>
          body{
            background-color:rgb(1, 108, 53);color: lightblue; font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
         .hero-name{font-size:60px;font-weight:bold;color:lightpink;text-shadow:3px 3px orange;}
         .tagline{font-style:italic;color:lime;text-transform:capitalize;}
         .label{text-transform:uppercase;text-decoration:underline;color:indianred;}
         .power{font-weight:bold;color:gold;}
         .weakness{text-decoration:line-through;color:lightskyblue;}
         .badge{font-size:30px;font-weight:bold;color:mediumslateblue;transform:rotate(15deg);}
         .made-by{font-style:italic;color:orange;}
        </style>
    </head>
    <body>
        <h1 class="hero-name">Superman</h1>

             <p class="tagline">I can fly!</p>
             <h2 class="label">SuperPOWER</h2>
             <p class="power">Super strength, flight</p>
             <p class="power">X-ray vision, invulnerability</p>
                <h2 class="label">SuperWEAKNESS</h2>
                <p class="weakness">Kryptonite</p>
                <p class="weakness">Magic</p>
                <br>
                <br>
                <br>
                <br>
                <br>
                <br>
                <br>
                <p class="badge">Top hero</p>
                <p class="made-by">Made by: Tejas</p>
    </body>
</html>
